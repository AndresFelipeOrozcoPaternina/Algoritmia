<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title">
<title id="title">Diagrama de flujo: edadendias</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#334155"/></marker></defs>
<rect width="600" height="470" fill="white"/>
<rect x="65" y="20" width="470" height="56" rx="28" fill="#fef3c7" stroke="#334155"/>
<text x="300" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Inicio: Edad en días</text>
<path d="M300,76 V105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,110 535,110 505,166 65,166" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Leer edad</text>
<path d="M300,166 V195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="200" width="470" height="56" rx="0" fill="#dbeafe" stroke="#334155"/>
<text x="300" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">dias = edad * 365</text>
<path d="M300,256 V285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,290 535,290 505,346 65,346" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">"Has vivido " + dias + " días"</text>
<path d="M300,346 V375" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="380" width="470" height="56" rx="28" fill="#fef3c7" stroke="#334155"/>
<text x="300" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Fin</text>
</svg>
