<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title">
<title id="title">Diagrama de flujo: propinas</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#334155"/></marker></defs>
<rect width="600" height="830" fill="white"/>
<rect x="65" y="20" width="470" height="56" rx="28" fill="#fef3c7" stroke="#334155"/>
<text x="300" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Inicio: Propinas</text>
<path d="M300,76 V105" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,110 535,110 505,166 65,166" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Leer cuenta</text>
<path d="M300,166 V195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,200 535,200 505,256 65,256" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Leer porcentaje</text>
<path d="M300,256 V285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,290 535,290 505,346 65,346" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Leer personas</text>
<path d="M300,346 V375" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="380" width="470" height="56" rx="0" fill="#dbeafe" stroke="#334155"/>
<text x="300" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">propina = cuenta * porcentaje / 100</text>
<path d="M300,436 V465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="470" width="470" height="56" rx="0" fill="#dbeafe" stroke="#334155"/>
<text x="300" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">total = cuenta + propina</text>
<path d="M300,526 V555" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="560" width="470" height="56" rx="0" fill="#dbeafe" stroke="#334155"/>
<text x="300" y="593" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">porPersona = total / personas</text>
<path d="M300,616 V645" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="95,650 535,650 505,706 65,706" fill="#dcfce7" stroke="#166534"/>
<text x="300" y="683" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">"Cada uno paga: $" + porPersona</text>
<path d="M300,706 V735" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="65" y="740" width="470" height="56" rx="28" fill="#fef3c7" stroke="#334155"/>
<text x="300" y="773" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Fin</text>
</svg>
